<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f3f5f7"/><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#162535}.small{font-size:15px}.box{stroke:#395a72;stroke-width:2}</style><text x="30" y="38" style="font-size:27px">NXT-PWR-EVT01 / R4 — PCB ZONING ONLY / HOLD</text><text x="30" y="70">No board outline, dimensions, insulation clearance or manufacturing rules established.</text><rect x="30" y="110" width="1140" height="570" rx="20" fill="none" stroke="#9a4b30" stroke-width="4" stroke-dasharray="12 8"/><text x="55" y="140">Touch-protection enclosure boundary candidate; all HV interfaces inside enclosure</text><rect class="box" x="60" y="180" width="240" height="180" fill="#e2edf8"/><text x="80" y="213">24V input / fuse / U100</text><text class="small" x="80" y="245">Input bulk and surge return</text><text class="small" x="80" y="273">RTN100 isolated from PGND</text><text class="small" x="80" y="301">Bias branch before U100</text><rect class="box" x="340" y="180" width="280" height="180" fill="#fff2cb"/><text x="360" y="213">Final cut / L / Q / SiC</text><text class="small" x="360" y="245">Q101 and current setting HOLD</text><text class="small" x="360" y="273">Minimize power commutation loop</text><text class="small" x="360" y="301">No fitted L_FEED bulk capacitor</text><rect class="box" x="660" y="180" width="450" height="180" fill="#ffe0d8"/><text x="680" y="213">HV output capacitors / bleed / protected load</text><text class="small" x="680" y="245">Short direct HV return to PGND power star</text><text class="small" x="680" y="273">Heat from bleed separate from NTC electronics</text><text class="small" x="680" y="301">HV connector / cover / discharge qualification HOLD</text><rect class="box" x="60" y="410" width="320" height="180" fill="#dcf0df"/><text x="80" y="443">12V / 5V / monitor / latch</text><text class="small" x="80" y="475">Control and sensor cable routing</text><text class="small" x="80" y="503">Manual START/RESET/STOP at panel</text><text class="small" x="80" y="531">Protected low-voltage observation</text><rect class="box" x="420" y="410" width="330" height="180" fill="#e8e2f6"/><text x="440" y="443">Controller / SENSE Kelvin star</text><text class="small" x="440" y="475">Dedicated shunt top/bottom sense pair</text><text class="small" x="440" y="503">No gate or power return in Kelvin trace</text><text class="small" x="440" y="531">GND_CTRL / GND_DRV net ties at star</text><text x="790" y="450">Thermal / mechanical HOLD</text><text class="small" x="790" y="485">Insulated M3 mounting candidates</text><text class="small" x="790" y="515">No position / metal clearance fixed</text><text class="small" x="790" y="545">Hotspot and heatsink envelope TBD</text><text x="55" y="642">No PCB file, no DRC, no universal 2mm/3mm safety-release spacing.</text><text class="small" x="30" y="720">Clearance/creepage needs working voltage, impulse, pollution, material group, altitude and enclosure basis.</text></svg>